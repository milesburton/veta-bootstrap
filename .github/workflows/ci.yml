name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend lint, type-check, unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-frontend-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Unit tests
        working-directory: frontend
        run: npm test --if-present

  docs-build:
    name: Docs build & lint
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      # A required status check must always report a result, so the
      # docs-changed condition is applied per step, not at job level. That
      # way a non-docs PR still reports success instead of leaving a
      # required check pending forever.
      - name: No docs changes, nothing to validate
        if: needs.changes.outputs.docs != 'true'
        run: echo "No staged changes under docs/, skipping docs validation."

      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs == 'true'

      - name: Setup Node
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache npm
        if: needs.changes.outputs.docs == 'true'
        uses: actions/cache@v5
        with:
          path: |
            docs/site/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-docs-${{ hashFiles('docs/site/package-lock.json', 'docs/site/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-docs-

      - name: Install docs dependencies
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs/site
        run: npm ci

      - name: Markdown lint
        if: needs.changes.outputs.docs == 'true'
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "docs/**/*.mdx" "!docs/site/node_modules/**" "!docs/site/dist/**"

      - name: Validate mermaid blocks
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs/site
        run: npm run validate:mermaid

      - name: Check for leaked private IPs in public docs
        if: needs.changes.outputs.docs == 'true'
        run: |
          # docs/site/src/ is built and published publicly. Reject RFC1918
          # addresses (10/8, 172.16/12, 192.168/16), which would advertise
          # internal infrastructure. Loopback (127/8) is excluded: it is a
          # generic "this machine" address and leaks nothing.
          if grep -rnE '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+)\b' \
              docs/site/src/ \
              --include='*.md' --include='*.mdx' --include='*.html' --include='*.tsx' --include='*.ts'; then
            echo "::error::Private IP address(es) leaked into public docs (docs/site/src/). Remove or describe abstractly."
            exit 1
          fi
          echo "No private IPs in public docs."

      - name: Build Astro site
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs/site
        run: npm run build

      - name: Validate internal links
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs/site
        run: npm run validate:links
